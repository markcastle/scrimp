[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/markcastle/scrimp"

[workspace.dependencies]
scrimp-core = { path = "crates/scrimp-core" }
scrimp-win = { path = "crates/scrimp-win" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Ctrl+C in the command line cancels a job between files.
ctrlc = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# Microsoft's own bindings to the Windows API. Only scrimp-win (and later
# scrimp-shell) use it, and only on Windows.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[workspace.lints.rust]
# Denied everywhere. The two crates that must call Windows directly
# (scrimp-win and scrimp-shell, when they arrive) opt out at the top of
# their lib.rs, and nowhere else may.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Never set `panic = "abort"` in any profile. The panic strategy applies to
# the whole workspace, and the Explorer menu DLL relies on catching panics
# so a bug in Scrimp can never take Explorer down with it.
