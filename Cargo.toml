[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/markcastle/scrimp"

[workspace.dependencies]
scrimp-core = { path = "crates/scrimp-core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
# Denied everywhere. The two crates that must call Windows directly
# (scrimp-win and scrimp-shell, when they arrive) opt out at the top of
# their lib.rs, and nowhere else may.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Never set `panic = "abort"` in any profile. The panic strategy applies to
# the whole workspace, and the Explorer menu DLL relies on catching panics
# so a bug in Scrimp can never take Explorer down with it.
