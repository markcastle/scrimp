name: CI

# Adapted from Keevoro's. Scrimp only runs on Windows, so almost everything
# runs on windows-latest. scrimp-core and the release tooling are pure Rust
# and are also tested on Linux, which keeps Windows assumptions out of the
# core.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The PowerShell scripts are not Rust, so they get their own check:
      # each must at least parse.
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @('install.ps1') + (Get-ChildItem scripts -Filter *.ps1 | ForEach-Object FullName)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($script): $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Small VHDX drives of each kind scrimp-win is tested against. The
      # script sets the SCRIMP_TEST_* variables the tests look for.
      - name: Make the test drives
        shell: pwsh
        run: ./scripts/test-volumes.ps1
      - run: cargo test --workspace --locked

  # The parts that must never depend on Windows.
  portable:
    name: test (core on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p scrimp-core -p xtask

  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Small VHDX drives of each kind scrimp-win is tested against. The
      # script sets the SCRIMP_TEST_* variables the tests look for.
      - name: Make the test drives
        shell: pwsh
        run: ./scripts/test-volumes.ps1
      - name: Coverage (fails under 90% of lines)
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90 --summary-only
      # The code that compresses, decompresses, verifies and reads a file's
      # state is held to 95%, file by file. On a shortfall it lists the lines
      # no test runs.
      - name: Code that changes files (fails under 95% of lines)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo xtask coverage lcov.info

  # Licences every dependency is under, and known security advisories.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Builds the real installer, then installs it silently, checks every
  # file, registry entry and PATH change, installs again over the top,
  # uninstalls and checks nothing is left. The installer is kept as a
  # download on the run's page, so every change has one to try.
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer
      - run: scripts/build-installer.sh
      # No Visual C++ redistributable or other runtime: only Windows' own DLLs.
      - name: Check it needs nothing but Windows
        run: cargo xtask imports target/release/scrimp.exe target/release/scrimpw.exe target/release/scrimp_shell.dll
      - name: Install, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1 installers/Scrimp-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Scrimp installer
          path: installers/*
          retention-days: 14
