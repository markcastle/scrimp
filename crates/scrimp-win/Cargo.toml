[package]
name = "scrimp-win"
description = "Safe wrappers over the Windows file compression, file and volume calls Scrimp uses. The only crate besides the menu DLL allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
scrimp-core.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[features]
# Task dialogs, for the worker only. They need Common Controls v6, which a
# program gets from its manifest; see src/ui.rs.
ui = ["windows/Win32_UI_Controls", "windows/Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
